<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SoulPair</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>

<section id="rolePage" class="role-page">
  <div class="role-wrap">
    <div class="logo-dot"></div>
    <h1>SoulPair</h1>
    <p>Who are you?</p>

    <div class="role-grid">
      <div class="role-card" data-role="boy">
        <img src="boy.jpg" alt="boy">
        <span>TMW</span>
      </div>

      <div class="role-card" data-role="girl">
        <img src="girl.jpg" alt="girl">
        <span>CHO</span>
      </div>
    </div>
  </div>
</section>

<main id="app" class="app hidden">

  <section class="cards">

    <div class="status-card">
      <img id="myAvatar" class="avatar" src="boy.jpg">

      <div id="myLottie" class="lottie"></div>

      <div id="myStatus" class="status-label">
        Free
      </div>

      <div id="myTime" class="status-time">
        just now
      </div>
    </div>

    <div class="status-card">
      <img id="partnerAvatar" class="avatar" src="girl.jpg">

      <div id="partnerLottie" class="lottie"></div>

      <div id="partnerStatus" class="status-label">
        Waiting...
      </div>

      <div id="partnerTime" class="status-time">
        waiting...
      </div>
    </div>

  </section>

  <section class="center-text-wrap">
    <div id="typingText" class="typing-text"></div>
  </section>

  <section class="bottom-ui">
    <button id="openSheetBtn" class="status-btn">
      Update Status
    </button>
  </section>

  <div class="flutter-wrap">

    <div class="flutter-label">
      hold to send a flutter
    </div>

    <button id="flutterBtn" class="flutter-btn">

      <svg class="progress-ring" width="120" height="120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>

        <circle
          id="ringFill"
          class="ring-fill"
          cx="60"
          cy="60"
          r="52"
        ></circle>
      </svg>

      <div class="heart-core">
        
      </div>

    </button>
  </div>

</main>

<div id="overlay" class="overlay"></div>

<section id="sheet" class="sheet">

  <div id="sheetHandle" class="sheet-handle"></div>

  <div class="sheet-title">
    Choose Status
  </div>

  <div id="statusList" class="status-list"></div>

</section>

<div id="toast" class="toast"></div>

<div id="buzzOverlay" class="buzz-overlay">
  <div class="buzz-heart"></div>
</div>

<script src="script.js"></script>
</body>
</html>
