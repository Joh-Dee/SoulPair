<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Soulpair</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<!-- =========================
IDENTITY SCREEN
========================= -->
<section id="identity-screen" class="identity-screen hidden-select">

  <div class="identity-content">
    <p class="identity-small">Soulpair</p>
    <h1 class="identity-title">Who Are You?</h1>
    <p class="identity-subtitle">Choose your side once.</p>

    <div class="identity-grid">

      <div class="identity-card" data-role="tmw">
        <div class="identity-ring">
          <img src="boy.jpg" alt="TMW">
        </div>
        <h3>TMW</h3>
      </div>

      <div class="identity-card" data-role="cho">
        <div class="identity-ring">
          <img src="girl.jpg" alt="CHO">
        </div>
        <h3>CHO</h3>
      </div>

    </div>
  </div>

</section>

<!-- =========================
DASHBOARD
========================= -->
<section id="dashboard" class="dashboard hidden-select hidden">

  <header class="topbar">

    <div class="profile-block">
      <div class="profile-ring-small">
        <img id="my-profile" src="boy.jpg" alt="Me">
      </div>
      <span id="my-name">TMW</span>
    </div>

    <div class="connection-line">
      <div class="pulse-dot"></div>
    </div>

    <div class="profile-block">
      <div class="profile-ring-small">
        <img id="partner-profile" src="girl.jpg" alt="Partner">
      </div>
      <span id="partner-name">CHO</span>
    </div>

  </header>

  <!-- Typing Text -->
  <section class="typing-section">
    <p id="typing-text"></p>
    <span class="typing-cursor">|</span>
  </section>

  <!-- Mood Cards -->
  <section class="mood-wrapper">

    <div class="mood-card" id="my-card">
      <div class="mood-top">
        <div class="mini-lottie" id="my-lottie"></div>
        <div>
          <p class="mood-title">My Mood</p>
          <h3 id="my-mood-label">Not Set</h3>
        </div>
      </div>
    </div>

    <div class="divider-heart"></div>

    <div class="mood-card" id="partner-card">
      <div class="mood-top">
        <div class="mini-lottie" id="partner-lottie"></div>
        <div>
          <p class="mood-title">Partner Mood</p>
          <h3 id="partner-mood-label">Waiting...</h3>
        </div>
      </div>
    </div>

  </section>

  <!-- Set Mood -->
  <section class="action-section">
    <button id="open-sheet-btn" class="mood-btn">
      Set My Mood
    </button>
  </section>

  <!-- Miss U -->
  <section class="miss-section">

    <p class="miss-hint">Hold 2 seconds to send a flutter</p>

    <button id="miss-btn" class="miss-btn">

      <div class="miss-ripple"></div>

      <div class="miss-inner">
        <svg class="heart-svg" viewBox="0 0 100 90">
          <path d="M50 85 C50 85 5 55 5 28 C5 12 18 3 30 3 C38 3 46 7 50 14 C54 7 62 3 70 3 C82 3 95 12 95 28 C95 55 50 85 50 85Z"/>
        </svg>

        <span>MISS U</span>
      </div>

      <svg class="progress-ring" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
        <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="54"></circle>
      </svg>

    </button>

  </section>

</section>

<!-- =========================
BOTTOM SHEET
========================= -->
<div id="overlay" class="overlay"></div>

<div id="sheet" class="sheet">

  <div class="sheet-handle"></div>

  <h2>Select Mood</h2>

  <div id="mood-grid" class="mood-grid"></div>

</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
