<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Soulpair</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <main class="app-wrapper">

    <header class="profiles-header">

      <div class="profile-card">
        <div class="profile-ring">
          <img src="assets/boy.jpg" class="profile-img" alt="You" />
        </div>
        <span class="profile-label">You</span>
        <div class="mood-dot"></div>
      </div>

      <div class="heart-connector">
        <svg width="36" height="20" viewBox="0 0 36 20">
          <path d="M2 10 Q9 2 18 10 Q27 18 34 10"
            stroke="rgba(255,100,120,0.4)"
            stroke-width="1.5"
            fill="none"
            stroke-dasharray="3 3" />
        </svg>

        <div class="pulse-dot"></div>
      </div>

      <div class="profile-card">
        <div class="profile-ring">
          <img src="assets/girl.jpg" class="profile-img" alt="ABC" />
        </div>
        <span class="profile-label">ABC</span>
        <div class="mood-dot"></div>
      </div>

    </header>

    <section class="animation-section">

      <div class="lottie-frame">
        <div id="lottie-container"></div>
      </div>

      <div class="mood-label-badge">
        <span id="mood-label-text">Set your mood </span>
      </div>

    </section>

    <section class="romantic-section">
      <p class="romantic-text" id="romantic-text"></p>
      <span class="typing-cursor">|</span>
    </section>

    <section class="mood-action-section">
      <button class="set-mood-btn" id="set-mood-btn">
        <span class="btn-icon"></span>
        <span>Set My Mood</span>
      </button>
    </section>

    <section class="mood-status-section">

      <div class="mood-card glass-card" id="my-mood-card">
        <div class="mood-card-header">
          <span class="mood-card-emoji" id="my-mood-emoji"></span>
          <span class="mood-card-who">My Mood</span>
        </div>

        <div class="mood-card-label" id="my-mood-text">No mood selected</div>
      </div>

      <div class="mood-divider">
        <div class="divider-line"></div>
        <span></span>
        <div class="divider-line"></div>
      </div>

      <div class="mood-card glass-card" id="partner-mood-card">
        <div class="mood-card-header">
          <span class="mood-card-emoji" id="partner-mood-emoji"></span>
          <span class="mood-card-who">ABC Mood</span>
        </div>

        <div class="mood-card-label" id="partner-mood-text">Waiting for sync...</div>
      </div>

    </section>

    <section class="missu-section">

      <div class="missu-hint">Hold 2 sec to send a flutter </div>

      <button class="missu-btn" id="missu-btn">

        <div class="missu-ripple"></div>

        <div class="missu-inner">

          <svg class="heart-svg" viewBox="0 0 100 90">
            <path d="M50 85 C50 85 5 55 5 28 C5 12 18 3 30 3 C38 3 46 7 50 14 C54 7 62 3 70 3 C82 3 95 12 95 28 C95 55 50 85 50 85Z"/>
          </svg>

          <span class="missu-text">MISS U</span>

        </div>

        <svg class="missu-progress-ring" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="54" class="ring-bg"/>
          <circle cx="60" cy="60" r="54" class="ring-fill" id="ring-fill"/>
        </svg>

      </button>

    </section>

  </main>

  <div class="sheet-overlay" id="sheet-overlay"></div>

  <div class="bottom-sheet" id="bottom-sheet">

    <div class="sheet-handle"></div>

    <h3 class="sheet-title">How are you feeling?</h3>

    <div class="mood-grid" id="mood-grid"></div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>

</body>
</html>
