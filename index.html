<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>SoulPair</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- ROLE PAGE -->
  <section id="role-page" class="role-page hidden">

    <div class="role-inner">

      <div class="role-top">
        <div class="brand-dot"></div>
        <h1>SoulPair</h1>
        <p>Who are you?</p>
      </div>

      <div class="role-grid">

        <div class="role-card" data-role="boy">
          <img src="boy.jpg" alt="boy">
          <div class="role-name">TMW</div>
        </div>

        <div class="role-card" data-role="girl">
          <img src="girl.jpg" alt="girl">
          <div class="role-name">CHO</div>
        </div>

      </div>

    </div>

  </section>

  <!-- APP -->
  <main id="app" class="app hidden">

    <!-- TOP -->
    <header class="top-section">

      <div class="profile-card">

        <img id="my-avatar" src="boy.jpg">

        <div class="profile-info">
          <div id="my-name" class="profile-name">TMW</div>

          <div class="status-wrap">

            <div id="my-lottie" class="status-lottie"></div>

            <div class="status-meta">
              <div id="my-status" class="status-label">
                No status
              </div>

              <div id="my-time" class="status-time">
                waiting...
              </div>
            </div>

          </div>

        </div>

      </div>

      <div class="divider"></div>

      <div class="profile-card">

        <img id="partner-avatar" src="girl.jpg">

        <div class="profile-info">
          <div id="partner-name" class="profile-name">CHO</div>

          <div class="status-wrap">

            <div id="partner-lottie" class="status-lottie"></div>

            <div class="status-meta">
              <div id="partner-status" class="status-label">
                No status
              </div>

              <div id="partner-time" class="status-time">
                waiting...
              </div>
            </div>

          </div>

        </div>

      </div>

    </header>

    <!-- SCROLL AREA -->
    <section class="content-scroll">

      <div class="typing-wrap">
        <div id="typing-text" class="typing-text"></div>
      </div>

      <button id="open-sheet-btn" class="open-sheet-btn">
        Update Status
      </button>

    </section>

    <!-- MISS YOU -->
    <section class="miss-fixed">

      <div class="miss-hint">
        hold to send a flutter
      </div>

      <button id="miss-btn" class="miss-btn">

        <svg class="progress-ring" width="130" height="130">
          <circle class="ring-bg" cx="65" cy="65" r="54"></circle>

          <circle
            id="ring-fill"
            class="ring-fill"
            cx="65"
            cy="65"
            r="54"
          ></circle>
        </svg>

        <div class="heart-wrap">
          
        </div>

      </button>

    </section>

  </main>

  <!-- SHEET -->
  <div id="sheet-overlay" class="sheet-overlay"></div>

  <section id="sheet" class="sheet">

    <div id="sheet-handle" class="sheet-handle"></div>

    <div class="sheet-title">
      Choose Status
    </div>

    <div id="status-grid" class="status-grid"></div>

  </section>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- BUZZ -->
  <div id="buzz-overlay" class="buzz-overlay">

    <div class="buzz-heart">
      
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
