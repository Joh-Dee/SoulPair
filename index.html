<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>SoulPair</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head>
<body>

  <!-- ROLE PAGE -->
  <section id="rolePage" class="role-page hidden">

    <div class="role-inner">

      <div class="logo-dot"></div>

      <h1 class="app-title">SoulPair</h1>

      <p class="role-subtitle">
        Who Are You?
      </p>

      <div class="role-grid">

        <div class="role-card" data-role="boy">

          <img src="boy.jpg" alt="boy" />

          <div class="role-name">
            TMW
          </div>

        </div>

        <div class="role-card" data-role="girl">

          <img src="girl.jpg" alt="girl" />

          <div class="role-name">
            CHO
          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- MAIN APP -->
  <main id="app" class="app hidden">

    <!-- TOP -->
    <header class="top-section">

      <!-- MY CARD -->
      <div class="status-card">

        <img
          id="myAvatar"
          class="profile-img"
          src="boy.jpg"
          alt=""
        />

        <div
          id="myLottie"
          class="status-lottie"
        ></div>

        <div
          id="myStatus"
          class="status-label"
        >
          Free
        </div>

        <div
          id="myTime"
          class="status-time"
        >
          just now
        </div>

      </div>

      <!-- PARTNER CARD -->
      <div class="status-card">

        <img
          id="partnerAvatar"
          class="profile-img"
          src="girl.jpg"
          alt=""
        />

        <div
          id="partnerLottie"
          class="status-lottie"
        ></div>

        <div
          id="partnerStatus"
          class="status-label"
        >
          Waiting...
        </div>

        <div
          id="partnerTime"
          class="status-time"
        >
          waiting...
        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <section class="content-scroll">

      <div class="typing-box">

        <div
          id="typingText"
          class="typing-text"
        ></div>

      </div>

      <button
        id="openSheetBtn"
        class="update-btn"
      >
        Update Status
      </button>

    </section>

    <!-- MISS YOU -->
    <section class="miss-fixed">

      <div class="miss-hint">
        hold to send a flutter
      </div>

      <button id="missBtn" class="miss-btn">

        <svg
          class="progress-ring"
          width="140"
          height="140"
        >

          <circle
            class="ring-bg"
            cx="70"
            cy="70"
            r="58"
          ></circle>

          <circle
            id="ringFill"
            class="ring-fill"
            cx="70"
            cy="70"
            r="58"
          ></circle>

        </svg>

        <div class="heart-core">
          
        </div>

      </button>

    </section>

  </main>

  <!-- BOTTOM SHEET -->
  <div
    id="sheetOverlay"
    class="sheet-overlay"
  ></div>

  <section
    id="sheet"
    class="sheet"
  >

    <div
      id="sheetHandle"
      class="sheet-handle"
    ></div>

    <div class="sheet-title">
      Choose Status
    </div>

    <div
      id="statusGrid"
      class="status-grid"
    ></div>

  </section>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- BUZZ -->
  <div
    id="buzzOverlay"
    class="buzz-overlay"
  >

    <div class="buzz-heart">
      
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
