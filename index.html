<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SoulPair</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- INTRO PAGE -->
<section id="intro-page" class="page active">

  <div class="intro-content">

    <div class="intro-top">
      <p class="tiny-title">SOULPAIR</p>
      <h1>Who Are You?</h1>
      <p class="intro-subtitle">
        Choose your identity to continue.
      </p>
    </div>

    <div class="identity-grid">

      <div class="identity-card" data-role="tmw">
        <div class="identity-ring">
          <img src="boy.jpg" class="identity-img" alt="TMW">
        </div>

        <div class="identity-info">
          <h2>TMW</h2>
          <p>The Boy Side</p>
        </div>
      </div>

      <div class="identity-card" data-role="cho">
        <div class="identity-ring">
          <img src="girl.jpg" class="identity-img" alt="CHO">
        </div>

        <div class="identity-info">
          <h2>CHO</h2>
          <p>The Girl Side</p>
        </div>
      </div>

    </div>

  </div>

</section>

<!-- DASHBOARD -->
<section id="dashboard-page" class="page">

  <div class="dashboard-wrapper">

    <header class="top-header">

      <div class="profile-box">
        <div class="profile-ring small">
          <img id="my-profile" src="boy.jpg" class="profile-img">
        </div>
        <span id="my-name">TMW</span>
      </div>

      <div class="center-heart">
        
      </div>

      <div class="profile-box">
        <div class="profile-ring small">
          <img id="partner-profile" src="girl.jpg" class="profile-img">
        </div>
        <span id="partner-name">CHO</span>
      </div>

    </header>

    <section class="hero-section">

      <div class="lottie-wrapper">
        <div id="lottie-container"></div>
      </div>

      <div class="current-mood-badge">
        <span id="current-mood-label">Waiting...</span>
      </div>

    </section>

    <section class="quote-section">
      <p id="quote-text"></p>
    </section>

    <section class="mood-button-section">
      <button id="open-mood-btn">
        Set My Mood
      </button>
    </section>

    <section class="mood-status-section">

      <div class="mood-card">
        <span class="mood-title">My Mood</span>
        <h3 id="my-mood-text"></h3>
      </div>

      <div class="divider-heart"></div>

      <div class="mood-card">
        <span class="mood-title" id="partner-mood-title">CHO Mood</span>
        <h3 id="partner-mood-text"></h3>
      </div>

    </section>

    <section class="buzz-section">

      <p class="buzz-label">
        Hold to send a flutter
      </p>

      <button id="buzz-btn">
        <div class="buzz-inner">
          
        </div>
      </button>

    </section>

  </div>

</section>

<!-- MOOD SHEET -->
<div id="overlay"></div>

<div id="mood-sheet">

  <div class="sheet-bar"></div>

  <h2>Choose Mood</h2>

  <div id="mood-grid"></div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
